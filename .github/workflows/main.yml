name: Selenium UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven # تفعيل الـ Cache للمكتبات (Dependencies)

      # تحسين الأداء: تفعيل الـ Cache للـ Allure Binary اللي كودك بينزلها
      - name: Cache Allure Binaries
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/allure
          key: ${{ runner.os }}-allure-binaries
          restore-keys: |
            ${{ runner.os }}-allure-

      - name: Prepare Environment
        run: mkdir -p test-output/full-report/history test-output/reports

      - name: Run Selenium Tests & Generate Report
        # تحسين الأداء: -T 1C بيخلي المافن يستخدم كل الـ Cores المتاحة للـ Compile
        run: mvn clean test -DsuiteXmlFile=testng.xml -T 1C
        continue-on-error: true

      - name: Prepare Index for GitHub Pages
        if: always()
        shell: bash
        run: |
          cd test-output/reports
          # التأكد من وجود ملفات قبل النسخ لتجنب الخطأ
          if ls AllureReport_*.html 1> /dev/null 2>&1; then
            cp $(ls -t AllureReport_*.html | head -1) index.html
            echo "Index.html created successfully."
          else
            echo "No Allure report found to index."
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-report
          path: |
            test-output/allure-results/
            test-output/reports/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: test-output/reports/
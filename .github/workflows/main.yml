name: Selenium UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Prepare Environment for Allure History
        run: mkdir -p test-output/full-report/history

      - name: Run Selenium Tests & Generate Report
        run: mvn clean test -DsuiteXmlFile=testng.xml
        continue-on-error: true

      - name: Upload Allure Results (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-report
          path: |
            test-output/allure-results/
            test-output/reports/
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # هنرفع الفولدر اللي فيه الملف الـ Single اللي إنت عايزه
          publish_dir: test-output/reports/